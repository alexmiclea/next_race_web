<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My App</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 600px;
      padding: 20px;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }
    p {
      font-size: 1.2rem;
      color: #94a3b8;
    }
    .buttons {
      margin-top: 30px;
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }
    a.button {
      text-decoration: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: bold;
      background: #22c55e;
      color: #022c22;
      transition: 0.2s;
    }
    a.button.secondary {
      background: #38bdf8;
      color: #082f49;
    }
    a.button:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }
    footer {
      margin-top: 40px;
      font-size: 0.9rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Your App Name</h1>
    <p>A short, catchy description of your mobile app. Explain what it does and why people should download it.</p>

    <div class="buttons">
      <a href="#" class="button">Download on App Store</a>
      <a href="#" class="button secondary">Get it on Google Play</a>
    </div>

    <footer>
      © 2026 Your Company. All rights reserved.
    </footer>
  </div>
</body>
</html>
